services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ezehlabs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ezehlabs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ezehlabs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ezehlabs-postgres:
